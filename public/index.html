<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="围绕 LeetCode 题目讨论解题思路、分析代码与复杂度，回顾刷题对话。">
    <title>Mini FastGPT · LeetCode 刷题助手</title>
    <link rel="stylesheet" href="/style.css">
    <script defer src="/vendor/marked.js"></script>
    <script defer src="/vendor/purify.js"></script>
    <script defer src="/app.js"></script>
</head>
<body>
    <div class="workspace">
        <aside class="sidebar" aria-label="会话管理">
            <a class="brand" href="/">Mini FastGPT<span>LeetCode 刷题助手</span></a>
            <button id="new-chat" class="primary" type="button">＋ 新建会话</button>
            <div class="section-label">最近会话 <span>当前浏览器</span></div>
            <nav id="conversation-list" aria-label="最近会话"></nav>
            <form id="open-form" class="open-form">
                <label for="conversation-id">打开已有会话</label>
                <div class="inline"><input id="conversation-id" placeholder="粘贴会话 ID" required autocomplete="off"><button id="open-button" type="submit">打开</button></div>
            </form>
            <p class="sidebar-note">历史保存在本地服务器。此列表仅记录你在当前浏览器打开过的会话。</p>
        </aside>
        <main>
            <header class="chat-header">
                <div><p class="eyebrow">思路 · 代码 · 复盘</p><h1 id="chat-title">开始一次刷题讨论</h1><p id="chat-id" class="muted">尚未选择会话</p></div>
                <button id="refresh-history" type="button" disabled>刷新历史</button>
            </header>
            <section id="messages" class="messages" aria-label="聊天记录" tabindex="0"></section>
            <div id="pending" class="pending" role="status" hidden><span class="dot"></span>正在生成回答，请稍候…</div>
            <footer class="composer">
                <p id="status" role="status" aria-live="polite">正在加载…</p>
                <form id="message-form">
                    <label class="sr-only" for="message-input">输入题目与解题思路</label>
                    <textarea id="message-input" rows="3" maxlength="10000" placeholder="粘贴题目描述、你的思路或代码，告诉我卡在哪里…" required></textarea>
                    <div class="composer-bottom"><span>Enter 发送 · Shift + Enter 换行</span><button id="send-button" class="primary" type="submit">发送消息 ↑</button></div>
                </form>
                <p class="disclaimer">可以讨论思路、分析代码与复杂度；代码尚未实际运行，请自行验证。</p>
            </footer>
        </main>
    </div>
</body>
</html>
