<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="LeetCode 学习 Agent：分析解题思路、检索笔记，调用沙箱验证 Python 代码。">
    <title>Mini Agent · LeetCode 学习 Agent</title>
    <link rel="stylesheet" href="/style.css">
    <script defer src="/vendor/marked.js"></script>
    <script defer src="/vendor/purify.js"></script>
    <script defer src="/app.js"></script>
</head>
<body>
    <div class="workspace">
        <aside class="sidebar" aria-label="会话管理">
            <a class="brand" href="/">Mini Agent<span>LeetCode 学习 Agent</span></a>
            <button id="new-session" class="primary" type="button">＋ 新建会话</button>
            <div class="section-label">最近会话 <span>当前浏览器</span></div>
            <nav id="conversation-list" aria-label="最近会话"></nav>
            <form id="open-form" class="open-form">
                <label for="conversation-id">打开已有会话</label>
                <div class="inline"><input id="conversation-id" placeholder="粘贴会话 ID" required autocomplete="off"><button id="open-button" type="submit">打开</button></div>
            </form>
            <p class="sidebar-note">历史保存在本地服务器。此列表仅记录你在当前浏览器打开过的会话。</p>
        </aside>
        <main>
            <header class="agent-header">
                <div><p class="eyebrow">思路 · 代码 · 复盘</p><h1 id="session-title">开始一次 Agent 刷题任务</h1><p id="session-id" class="muted">尚未选择会话</p></div>
                <button id="refresh-history" type="button" disabled>刷新历史</button>
            </header>
            <section id="messages" class="messages" aria-label="交互记录" tabindex="0"></section>
            <div id="pending" class="pending" role="status" hidden><span class="dot"></span>正在生成回答，请稍候…</div>
            <section id="tool-panel" class="tool-panel" aria-label="本轮工具记录" hidden>
                <h2>本轮调用的工具</h2>
                <p>执行结束后显示结果；刷新或切换会话后清空。</p>
                <div id="tool-events"></div>
            </section>
            <footer class="composer">
                <p id="status" role="status" aria-live="polite">正在加载…</p>
                <form id="message-form">
                    <label class="sr-only" for="message-input">输入题目与解题思路</label>
                    <textarea id="message-input" rows="3" maxlength="10000" placeholder="粘贴题目描述、你的思路或代码，告诉我卡在哪里…" required></textarea>
                    <div class="composer-bottom"><span>Enter 发送 · Shift + Enter 换行</span><button id="stop-button" type="button" hidden>停止</button><button id="send-button" class="primary" type="submit">发送消息 ↑</button></div>
                </form>
                <p class="disclaimer">可请求运行 Python 代码；执行结果仅针对提供的用例，不代表通过官方完整测试。</p>
            </footer>
        </main>
    </div>
</body>
</html>
